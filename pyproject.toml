[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yuanbao-reranker"
version = "0.1.0"
description = "Training, inference, and evaluation for Yuanbao-Reranker"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yuanbao_reranker = ["*.json"]
